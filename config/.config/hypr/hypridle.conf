general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
  # Workaround for a long-standing Hyprland/hyprlock bug where the numlock
  # keypad silently stops registering after a lock, requiring numlock to be
  # pressed twice to fix it (see hyprwm/hyprlock#371 and related upstream
  # issues). Simulating the keypress (tried via `wtype`) did NOT fix it --
  # confirmed live, the command ran fine but numlock stayed broken, most
  # likely because a Wayland virtual-keyboard-protocol event doesn't update
  # Hyprland's internal locked-modifier state the same way a real evdev
  # keypress does. `hyprctl switchxkblayout` re-syncs XKB state directly
  # through Hyprland's own API instead of injecting an input event at all --
  # confirmed live, this actually fixes it. `all` targets every connected
  # keyboard, not a specific device name, so it keeps working regardless of
  # which physical keyboard is attached (laptop-only vs external).
  on_unlock_cmd = hyprctl switchxkblayout all next
  inhibit_sleep = 3
}

listener {
    timeout = 600 # in seconds - 10min.
    on-timeout = hyprlock # command to run when timeout has passed.
}

listener {
    timeout = 900 # in seconds - 15min (5 min after locking).
    on-timeout = systemctl suspend
}
