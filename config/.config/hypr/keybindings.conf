# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

##################################
##        System Binginds       ##
##################################
bindd = $mainMod, Return, Open Main Terminal ($terminal), exec, $terminal --working-directory="$HOME"
bindd = $mainMod SHIFT, Return, Open Alternative Terminal ($alt_terminal),exec, $alt_terminal
bindd = $mainMod, Z, Close Active Window, killactive,
bindd = $mainMod, M, Open File Manager ,exec, $fileManager --new-window
bindd = $mainMod, V, Toggle Float Window ,togglefloating,
bindd = $mainMod, V, Toggle Float Window ,centerwindow,
# bindd = $mainMod CTRL, V, Toggle Float Window and resize,togglefloating,
# bindd = $mainMod CTRL, V, Toggle Float Window and resize,resizeactive, 80% 2%
# bindd = $mainMod CTRL, V, Toggle Float Window and resize,centerwindow,
bindd = $mainMod SHIFT, V, Pin Active Floating Window, pin,
bindd = $mainMod, J, Toggle Split Window, layoutmsg, togglesplit
bindd = , PRINT, Screenshot Selected Region, exec, hyprshot -m region --raw | satty -f -
bindd = SHIFT, PRINT, Screenshot Full Active Window, exec, hyprshot -m active -m output --raw | satty -f -
bindd = CTRL, PRINT, Screen Record a Selected Region ,exec, hyprcap rec -s region -w -n
bindd = CTRL SHIFT, PRINT, Screen Record Full Active Window ,exec, hyprcap rec -s window:active -w -n
bindd = , XF86Sleep, Suspend, exec, systemctl suspend
bindd = , XF86Calculator, Open Calculator, exec, gnome-calculator
bindd = $mainMod ALT, Space, Toggle Wallpaper, exec, wallpaper-toggle && hyprpaper-restart

##################################
##         Menu Binginds        ##
##################################
bindd = $mainMod, Space, Open Main Menu, exec, $menu -H -N
bindd = $mainMod CTRL, Space, Open KodingRocks Menu, exec, walker -m menus:kr_menu --minheight 1 -HN
bindd = $mainMod, B, Search on Google, exec, walker-google-search "$search_browser --new-window" "$(walker --dmenu -I --minheight 1 -p 'Search on Google...')"
bindd = $mainMod, X, Open Clipboard Menu, exec, walker -m clipboard
bindd = $mainMod, ESCAPE, Open Power Menu, exec, walker -m menus:power_menu --minheight 1 -HNn
bindd = $mainMod, PRINT, Open Screenshots Menu, exec, walker -m menus:screenshots_menu --minheight 1 -HNn
bindd = $mainMod, F1, Open Dev Menu, exec, walker -m menus:dev_menu --minheight 1 -HN
bindd = $mainMod, F2, Open Config Menu, exec, walker -m menus:config_files_menu --minheight 1 -H
bindd = $mainMod, F3, Open System Menu ,exec, walker -m menus:system_menu --minheight 1 -HN
bindd = $mainMod, F4, Open Setup Menu, exec, walker -m menus:setup_menu --minheight 1 -HN
bindd = $mainMod, F5, Open Shortcuts Menu, exec, walker -m menus:shortcuts_menu --minheight 1 -HN

# TODO: understand this and replace keyword
# bind = $mainMod, P, pseudo, # dwindle

##################################
##         Window Focus         ##
##################################
# Move focus with mainMod + arrow keys
bindd = $mainMod, left, Switch Focus to the Left, movefocus, l
bindd = $mainMod, right, Switch Focus to the Right, movefocus, r
bindd = $mainMod, up, Switch Focus Up, movefocus, u
bindd = $mainMod, down, Switch Focus Down, movefocus, d

##################################
##         Window Swap          ##
##################################
bindd = $mainMod SHIFT, left, Swap Window to the Left, swapwindow, l
bindd = $mainMod SHIFT, right, Swap Window to the Right, swapwindow, r
bindd = $mainMod ALT, left, Move Window to the Left, movewindow, l
bindd = $mainMod ALT, right, Move Window to the Right, movewindow, r
bindd = $mainMod SHIFT, up, Move Window Up, swapwindow, u
bindd = $mainMod SHIFT, down, Move Window Down, swapwindow, d

