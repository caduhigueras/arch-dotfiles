# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
# bind = $mainMod, Q, exec, $terminal
# bind = $mainMod, M, exit,

##################################
##        System Binginds       ##
##################################
bindd = $mainMod, Return, Open Main Terminal ($terminal), exec, $terminal +new-window
bindd = $mainMod SHIFT, Return, Open Alternative Terminal ($alt_terminal),exec, $alt_terminal
bindd = $mainMod, Z, Close Active Window, killactive,
bindd = $mainMod, M, Open File Manager ,exec, $fileManager --new-window
bindd = $mainMod, V, Toggle Float Window ,togglefloating,
bindd = $mainMod SHIFT, V, Pin Active Floating Window, pin,
bindd = $mainMod, J, Toggle Split Window, togglesplit, # dwindle
bindd = , PRINT, Screenshot Selected Region, exec, hyprshot -m region --raw | satty -f -
bindd = SHIFT, PRINT, Screenshot Full Active Window, exec, hyprshot -m active -m output --raw | satty -f -
bindd = CTRL, PRINT, Screen Record a Selected Region ,exec, hyprcap rec -s region -w -n
bindd = CTRL SHIFT, PRINT, Screen Record Full Active Window ,exec, hyprcap rec -s window:active -w -n
bindd = , XF86Sleep, Suspend, exec, systemctl suspend
bindd = , XF86Calculator, Open Calculator, exec, gnome-calculator

# bind = , PRINT, exec, /home/arch/.local/bin/hyprshot-satty.sh region
# bind = SHIFT, PRINT, exec, /home/arch/.local/bin/hyprshot-satty.sh active-output


##################################
##         Menu Binginds        ##
##################################
bindd = $mainMod, Space, Open Main Menu, exec, $menu -H -N
bindd = $mainMod CTRL, Space, Open KodingRocks Menu, exec, walker -m menus:kr_menu --minheight 1 -HN
bindd = $mainMod, B, Search on Google, exec, walker-google-search "$search_browser --new-window" "$(walker --dmenu -I --minheight 1 -p 'Search on Google...')"
bindd = $mainMod, X, Open Clipboard Menu, exec, walker -m clipboard
bindd = $mainMod, ESCAPE, Open Power Menu, exec, walker -m menus:power_menu --minheight 1 -HNn
bindd = $mainMod, PRINT, Open Screenshots Menu, exec, walker -m menus:screenshots_menu --minheight 1 -HNn
bindd = $mainMod, F1, Open Dev Menu, exec, walker -m menus:dev_menu --minheight 1 -HN
bindd = $mainMod, F2, Open Config Menu, exec, walker -m menus:config_files_menu --minheight 1 -H
bindd = $mainMod, F3, Open System Menu ,exec, walker -m menus:system_menu --minheight 1 -HN
bindd = $mainMod, F4, Open Setup Menu, exec, walker -m menus:setup_menu --minheight 1 -HN
bindd = $mainMod, F5, Open Shortcuts Menu, exec, walker -m menus:shortcuts_menu --minheight 1 -HN

# Toggle wallpaper
bindd = CTRL, Space, Toggle Wallpaper, exec, wallpaper-toggle && hyprpaper-restart


# TODO: understand this and replace keyword
# bind = $mainMod, P, pseudo, # dwindle

# Move focus with mainMod + arrow keys
bindd = $mainMod, left, Switch Focus to the Left, movefocus, l
bindd = $mainMod, right, Switch Focus to the Right, movefocus, r
bindd = $mainMod, up, Switch Focus Up, movefocus, u
bindd = $mainMod, down, Switch Focus Down, movefocus, d

# Swap windows 
bindd = $mainMod SHIFT, left, Move Window to the Left, swapwindow, l
bindd = $mainMod SHIFT, right, Move Window to the Right, swapwindow, r
bindd = $mainMod ALT, left, Move Window to the Left, movewindow, l
bindd = $mainMod ALT, right, Move Window to the Right, movewindow, r
bindd = $mainMod SHIFT, up, Move Window Up, swapwindow, u
bindd = $mainMod SHIFT, down, Move Window Down, swapwindow, d

##################################
##      Virtual Desktops        ##
##################################
# Switch to desk (all workspaces will switch along)
bindd = $mainMod, 1, Switch to Desk 1, vdesk, 1
bindd = $mainMod, 2, Switch to Desk 2, vdesk, 2
bindd = $mainMod, 3, Switch to Desk 3, vdesk, 3
bindd = $mainMod, 4, Switch to Desk 4, vdesk, 4
bindd = $mainMod, 5, Switch to Desk 5, vdesk, 5

# Move to desk and switch too
bindd = $mainMod SHIFT, 1, Move Active Window and go to Desk 1, movetodesk, 1
bindd = $mainMod SHIFT, 2, Move Active Window and go to Desk 2, movetodesk, 2
bindd = $mainMod SHIFT, 3, Move Active Window and go to Desk 3, movetodesk, 3
bindd = $mainMod SHIFT, 4, Move Active Window and go to Desk 4, movetodesk, 4
bindd = $mainMod SHIFT, 5, Move Active Window and go to Desk 5, movetodesk, 5

##################################
##      WEB APPs and APPS       ##
##################################
bindd = $mainMod SHIFT, Y, Open Youtube, exec, /opt/brave-bin/brave --profile-directory=Default --app-id=agimnkijcaahngcdmfeangaknmldooml
bindd = $mainMod SHIFT, C, Open ChatGPT, exec, webapp-launcher "https://chatgpt.com/"
bindd = $mainMod SHIFT, D, Open Google Calendar, exec, webapp-launcher "https://calendar.google.com/"
bindd = $mainMod SHIFT, E, Open Excel, exec, webapp-launcher "https://docs.google.com/spreadsheets"
bindd = $mainMod SHIFT, F, Open Figma, exec, webapp-launcher "https://www.figma.com/files/team/"
bindd = $mainMod SHIFT, G, Open GitHub, exec, webapp-launcher "https://github.com/"
bindd = $mainMod SHIFT, M, Open Gmail, exec, webapp-launcher "https://gmail.com/"
bindd = $mainMod SHIFT, P, Open Postman, exec, uwsm app -- postman
bindd = $mainMod SHIFT, T, Open Teams, exec, webapp-launcher https://teams.microsoft.com/v2/
bindd = $mainMod SHIFT, W, Open Whatsapp, exec, webapp-launcher "https://web.whatsapp.com/"
bindd = $mainMod, C, Open Chromium, exec, uwsm app -- chromium
bindd = $mainMod CTRL, C, Open Chromium (Incognito), exec, uwsm app -- chromium --incognito
bindd = $mainMod, O, Open Obsidian, exec, uwsm app -- obsidian --enable-wayland-ime
bindd = $mainMod, E, Open Email, exec, webapp-launcher "https://proton.me/"
bindd = $mainMod, F, Open Firefox, exec, uwsm app -- firefox
bindd = $mainMod CTRL, F, Open Firefox (Incognito), exec, uwsm app -- firefox --private-window
bindd = $mainMod, P, Open PhpStorm, exec, phpstorm
bindd = $mainMod, R, Open RustRover, exec, rustrover
bindd = $mainMod, S, Create a Scratch File, exec, $terminal -e scratch-create

# Example special workspace (scratchpad)
bindd = $mainMod, S, Open Scratch Workspace, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod CTRL, mouse:272, movewindow
bindm = $mainMod, mouse:272, resizewindow
bindd = $mainMod CTRL, left, Expand/Resize Active Window to the Left, resizeactive, -40 0
bindd = $mainMod CTRL, right, resiz/Resize Active Window to the Right, resizeactive,  40 0
bindd = $mainMod CTRL, up,    resiz/Resize Active Window Up, resizeactive,  0 -40
bindd = $mainMod CTRL, down,  resiz/Resize Active Window Down, resizeactive,  0  40

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
