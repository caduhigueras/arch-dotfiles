##################################
##      WEB APPs and APPS       ##
##################################
bindd = $mainMod SHIFT, Y, Youtube, exec, /opt/brave-bin/brave --profile-directory=Default --app-id=agimnkijcaahngcdmfeangaknmldooml
bindd = $mainMod SHIFT, C, ChatGPT, exec, webapp-launcher "https://chatgpt.com/"
bindd = $mainMod SHIFT, D, Calendar, exec, webapp-launcher "https://calendar.google.com/"
bindd = $mainMod SHIFT, E, Excel, exec, webapp-launcher "https://docs.google.com/spreadsheets"
bindd = $mainMod SHIFT, F, Figma, exec, webapp-launcher "https://www.figma.com/files/team/"
bindd = $mainMod SHIFT, G, GitHub, exec, webapp-launcher "https://github.com/"
bindd = $mainMod SHIFT, M, Gmail, exec, webapp-launcher "https://gmail.com/"
bindd = $mainMod SHIFT, P, Postman, exec, uwsm app -- postman
bindd = $mainMod SHIFT, W, Whatsapp, exec, webapp-launcher "https://web.whatsapp.com/"
bindd = $mainMod, C, Chromium, exec, uwsm app -- chromium
bindd = $mainMod CTRL, C, Chromium, exec, uwsm app -- chromium --incognito
bindd = $mainMod, O, Obsidian, exec, uwsm app -- obsidian --enable-wayland-ime
bindd = $mainMod, E, Email, exec, webapp-launcher "https://proton.me/"
bindd = $mainMod, F, Firefox, exec, uwsm app -- firefox
bindd = $mainMod CTRL, F, Chromium, exec, uwsm app -- firefox --private-window
bindd = $mainMod, P, PhpStorm, exec, phpstorm
bindd = $mainMod, R, RustRover, exec, rustrover


# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod CTRL, mouse:272, movewindow
bindm = $mainMod, mouse:272, resizewindow
bind = $mainMod CTRL, left,  resizeactive, -40 0
bind = $mainMod CTRL, right, resizeactive,  40 0
bind = $mainMod CTRL, up,    resizeactive,  0 -40
bind = $mainMod CTRL, down,  resizeactive,  0  40

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
