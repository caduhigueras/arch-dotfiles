# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
# bind = $mainMod, Q, exec, $terminal
# bind = $mainMod, M, exit,

##################################
##        System Binginds       ##
##################################
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, ESCAPE, exec, walker -m menus:power_menu
bind = $mainMod, B, exec, walker -m websearch
bind = $mainMod, X, exec, walker -m clipboard
bind = $mainMod SHIFT, Return, exec, $alt_terminal
bind = $mainMod, Z, killactive,
bind = $mainMod, M, exec, $fileManager --new-window
bind = $mainMod, Space, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, J, togglesplit, # dwindle
bind = , PRINT, exec, hyprshot -m region --raw | satty -f -
bind = SHIFT, PRINT, exec, hyprshot -m active -m output --raw | satty -f -
bind = $mainMod, PRINT, exec, hyprcap rec -s region -w -n
bind = $mainMod SHIFT, PRINT, exec, hyprcap rec -s window:active -w -n
bind = , XF86Sleep, exec, systemctl suspend

# TODO: understand this and replace keyword
# bind = $mainMod, P, pseudo, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Swap windows 
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

##################################
##      Virtual Desktops        ##
##################################
# Switch to desk (all workspaces will switch along)
bind = $mainMod, 1, vdesk, 1
bind = $mainMod, 2, vdesk, 2
bind = $mainMod, 3, vdesk, 3
bind = $mainMod, 4, vdesk, 4
bind = $mainMod, 5, vdesk, 5

# Move to desk and switch too
bind = $mainMod SHIFT, 1, movetodesk, 1
bind = $mainMod SHIFT, 2, movetodesk, 2
bind = $mainMod SHIFT, 3, movetodesk, 3
bind = $mainMod SHIFT, 4, movetodesk, 4
bind = $mainMod SHIFT, 5, movetodesk, 5


# Switch workspaces with mainMod + [0-9]
# bind = $mainMod, 1, workspace, 1
# bind = $mainMod, 2, workspace, 2
# bind = $mainMod, 3, workspace, 3
# bind = $mainMod, 4, workspace, 4
# bind = $mainMod, 5, workspace, 5
